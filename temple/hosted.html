<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Unkai-ji · A Japanese temple above the sea of clouds</title>
  <meta name="description" content="An interactive, procedurally built 3D Japanese mountain temple: five-storey pagoda, main hall, gate, bell tower, dry garden and koi pond, in four seasons and four times of day.">
  <meta name="theme-color" content="#14110f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M8 26 Q32 14 56 26 L50 28 Q32 21 14 28Z M16 38 Q32 29 48 38 L44 40 Q32 34 20 40Z' fill='%23c8432a'/%3E%3Crect x='30' y='6' width='4' height='12' fill='%23c9a24a'/%3E%3Crect x='22' y='40' width='20' height='16' fill='%23c8432a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <!-- Hosted build: identical to index.html, but three.js r187 comes from jsDelivr, for hosts
       (like Claude artifacts) whose content policy only lets scripts load from known CDNs. -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/" } }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="3D view of Unkai-ji temple. Drag to orbit, scroll to zoom."></canvas>

  <div id="markers" aria-label="Places in the temple"></div>

  <header class="title">
    <p class="kicker"><span lang="ja">霧峰山</span> · Muhō-zan</p>
    <h1><span class="jp" lang="ja">雲海寺</span><span class="latin">Unkai-ji</span></h1>
    <p class="sub">A mountain temple above the sea of clouds, built entirely in code.</p>
  </header>

  <nav class="views" aria-label="Viewpoints">
    <span class="lbl">Views</span>
    <div id="views"></div>
  </nav>

  <aside id="info" class="info" aria-hidden="true" aria-live="polite">
    <button class="close" type="button" aria-label="Close">×</button>
    <p class="jp" lang="ja"></p>
    <h2></h2>
    <p class="en"></p>
    <p class="body"></p>
    <ul></ul>
  </aside>

  <nav class="dock" aria-label="Scene controls">
    <div class="group">
      <span class="lbl">Hour</span>
      <div class="seg" id="seg-time" role="group" aria-label="Time of day"></div>
    </div>
    <div class="group">
      <span class="lbl">Season</span>
      <div class="seg" id="seg-season" role="group" aria-label="Season"></div>
    </div>
    <div class="group actions">
      <button id="t-tour" class="tog" type="button">Tour</button>
      <button id="t-labels" class="tog" type="button">Labels</button>
      <button id="t-sound" class="tog" type="button">Sound</button>
      <button id="b-bell" class="act" type="button">Ring bell</button>
      <button id="b-export" class="act" type="button">Export .glb</button>
    </div>
  </nav>

  <p class="hint">Drag to orbit · right-drag to pan · scroll to zoom · click the bell · <kbd>T</kbd> hour · <kbd>S</kbd> season</p>
  <div id="toast" class="toast" role="status"></div>

  <div id="loader" class="loader">
    <svg class="enso" viewBox="0 0 120 120" aria-hidden="true">
      <path d="M62 14 C 36 12, 14 32, 15 60 C 16 88, 40 106, 66 103 C 92 100, 108 78, 104 52 C 101 33, 88 20, 70 16" />
    </svg>
    <p class="loader-title"><span lang="ja">雲海寺</span></p>
    <p id="loader-step" class="loader-step">Preparing the site</p>
    <div class="loader-track"><div id="loader-bar" class="loader-bar"></div></div>
  </div>

  <noscript><p class="noscript">This temple is built live in your browser with JavaScript and WebGL.</p></noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
